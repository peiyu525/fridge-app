<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冰箱食材期限管家</title>
<style>
  :root{
    --bg:#eef6fb; --card:#ffffff; --text:#1f2d3a; --muted:#6b7c8a;
    --fresh:#2ea44f; --soon:#f0a30a; --urgent:#e5484d; --expired:#6b1d1d;
    --accent:#2f80ed; --radius:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--text)}
  header{background:linear-gradient(135deg,#2f80ed,#56ccf2);color:#fff;padding:24px 16px 20px;text-align:center}
  header h1{margin:0 0 4px;font-size:1.7rem}
  header p{margin:0;opacity:.9;font-size:.95rem}
  main{max-width:960px;margin:0 auto;padding:16px}
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
  .sum{background:var(--card);border-radius:var(--radius);padding:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;border:2px solid transparent}
  .sum.active{border-color:var(--accent)}
  .sum b{display:block;font-size:1.6rem}
  .sum span{font-size:.8rem;color:var(--muted)}
  .sum.s-expired b{color:var(--expired)} .sum.s-urgent b{color:var(--urgent)} .sum.s-soon b{color:var(--soon)} .sum.s-fresh b{color:var(--fresh)}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  .tabs{display:flex;background:#dcebf5;border-radius:999px;padding:4px}
  .tab{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-size:.95rem;cursor:pointer;color:var(--muted)}
  .tab.active{background:#fff;color:var(--accent);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.12)}
  input[type=search],input[type=text],input[type=number],input[type=date],select,textarea{
    font:inherit;padding:9px 12px;border:1px solid #c9d8e3;border-radius:10px;background:#fff;width:100%}
  .toolbar input[type=search]{flex:1;min-width:140px;width:auto}
  .toolbar select{width:auto}
  button.btn{font:inherit;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;background:var(--accent);color:#fff;font-weight:600}
  button.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent)}
  button.btn.danger{background:var(--urgent)}
  button.btn:hover{filter:brightness(1.07)}
  .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted);margin-bottom:12px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-1px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
  .item{background:var(--card);border-radius:var(--radius);padding:16px 12px 12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.07);position:relative;transition:transform .15s}
  .item:hover{transform:translateY(-3px)}
  .ring{width:96px;height:96px;border-radius:50%;margin:0 auto 10px;border:6px solid var(--ringc);display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f5f9fc;font-size:3rem;box-shadow:0 0 0 3px color-mix(in srgb,var(--ringc) 22%,transparent)}
  .ring img{width:100%;height:100%;object-fit:cover}
  .item.fresh{--ringc:var(--fresh)} .item.soon{--ringc:var(--soon)} .item.urgent{--ringc:var(--urgent)} .item.expired{--ringc:var(--expired)}
  .item.urgent .ring{animation:pulse 1.4s infinite}
  .item.expired .ring{filter:grayscale(.6)}
  @keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--urgent) 18%,transparent)}}
  .name{font-weight:700;font-size:1.05rem}
  .meta{font-size:.8rem;color:var(--muted);margin:2px 0}
  .badge{display:inline-block;margin-top:4px;padding:3px 10px;border-radius:999px;color:#fff;font-size:.8rem;font-weight:600;background:var(--ringc)}
  .tag{position:absolute;top:10px;left:10px;font-size:.7rem;padding:2px 8px;border-radius:999px;background:#e3f1fb;color:#1c6ea4}
  .tag.freezer{background:#e8e6ff;color:#4b3fb8}
  .actions{display:flex;gap:6px;justify-content:center;margin-top:10px}
  .actions button{flex:1;border:1px solid #d5e2ec;background:#fff;border-radius:8px;padding:5px 0;font-size:.8rem;cursor:pointer}
  .actions button:hover{background:#f0f7fc}
  .empty{text-align:center;color:var(--muted);padding:48px 0;grid-column:1/-1}
  dialog{border:0;border-radius:20px;padding:0;width:min(440px,92vw);box-shadow:0 10px 40px rgba(0,0,0,.25)}
  dialog::backdrop{background:rgba(20,40,60,.45)}
  form{padding:20px;display:grid;gap:12px}
  form h2{margin:0}
  label{font-size:.85rem;color:var(--muted);display:grid;gap:4px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .presets{display:flex;flex-wrap:wrap;gap:6px}
  .presets button{border:1px solid #cfe0ec;background:#f5fafd;border-radius:999px;padding:4px 10px;cursor:pointer;font-size:.85rem}
  .seg{display:flex;gap:8px}
  .seg label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid #c9d8e3;border-radius:10px;padding:8px;cursor:pointer;color:var(--text)}
  .seg input{width:auto}
  .seg label:has(input:checked){border-color:var(--accent);background:#eaf3ff;font-weight:700}
  .photo-row{display:flex;align-items:center;gap:12px}
  .preview{width:60px;height:60px;border-radius:50%;background:#f0f6fa;display:flex;align-items:center;justify-content:center;font-size:2rem;overflow:hidden;flex:none;border:2px solid #d5e2ec}
  .preview img{width:100%;height:100%;object-fit:cover}
  .form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2d3a;color:#fff;padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s}
  .toast.show{opacity:1}
  footer{text-align:center;color:var(--muted);font-size:.8rem;padding:20px}
  @media(max-width:520px){.summary{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <h1>🧊 冰箱食材期限管家</h1>
  <p>一眼看出什麼快過期，減少浪費食物</p>
</header>

<main>
  <section class="summary" id="summary"></section>

  <div class="toolbar">
    <div class="tabs" id="tabs">
      <button class="tab active" data-v="all">全部</button>
      <button class="tab" data-v="fridge">🧊 冷藏</button>
      <button class="tab" data-v="freezer">❄️ 冷凍</button>
    </div>
    <input type="search" id="search" placeholder="搜尋食材名稱…">
    <select id="sort">
      <option value="expiry">依到期日（最快優先）</option>
      <option value="name">依名稱</option>
      <option value="added">最近新增</option>
    </select>
    <button class="btn" id="addBtn">＋ 新增食材</button>
  </div>

  <div class="legend">
    <span><i style="background:var(--fresh)"></i>新鮮（8 天以上）</span>
    <span><i style="background:var(--soon)"></i>快到期（3–7 天）</span>
    <span><i style="background:var(--urgent)"></i>緊急（0–2 天）</span>
    <span><i style="background:var(--expired)"></i>已過期</span>
  </div>

  <section class="grid" id="grid"></section>
  <p style="text-align:center"><button class="btn ghost" id="resetBtn">還原範例資料</button></p>
</main>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle">新增食材</h2>
    <div>
      <div class="meta" style="margin-bottom:6px">快速選擇（自動帶入圖示、位置與建議保存天數）</div>
      <div class="presets" id="presets"></div>
    </div>
    <label>名稱
      <input type="text" id="fName" required maxlength="20" placeholder="例如：牛奶">
    </label>
    <div class="seg">
      <label><input type="radio" name="storage" value="fridge" checked> 🧊 冷藏</label>
      <label><input type="radio" name="storage" value="freezer"> ❄️ 冷凍</label>
    </div>
    <div class="row">
      <label>到期日
        <input type="date" id="fExpiry" required>
      </label>
      <label>數量
        <input type="number" id="fQty" min="1" value="1">
      </label>
    </div>
    <label>圖示 / 照片
      <div class="photo-row">
        <div class="preview" id="preview">🍽️</div>
        <div style="flex:1;display:grid;gap:6px">
          <input type="text" id="fEmoji" maxlength="4" placeholder="輸入表情符號，如 🥛">
          <input type="file" id="fPhoto" accept="image/*">
        </div>
      </div>
    </label>
    <button type="button" class="btn ghost" id="clearPhoto" style="display:none">移除照片</button>
    <label>備註（選填）
      <input type="text" id="fNote" maxlength="40" placeholder="例如：已開封">
    </label>
    <div class="form-actions">
      <button type="button" class="btn ghost" id="cancelBtn">取消</button>
      <button type="submit" class="btn" id="saveBtn">儲存</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>
<footer>資料儲存在你的瀏覽器（localStorage），不會上傳到網路。</footer>

<script>
(() => {
  const KEY = 'fridge-expiry-v1';
  const PRESETS = [
    {n:'牛奶',e:'🥛',s:'fridge',d:7},{n:'雞蛋',e:'🥚',s:'fridge',d:21},
    {n:'高麗菜',e:'🥬',s:'fridge',d:10},{n:'豆腐',e:'🧈',s:'fridge',d:4},
    {n:'優格',e:'🍦',s:'fridge',d:10},{n:'起司',e:'🧀',s:'fridge',d:30},
    {n:'蘋果',e:'🍎',s:'fridge',d:14},{n:'吐司',e:'🍞',s:'fridge',d:5},
    {n:'雞胸肉',e:'🍗',s:'freezer',d:90},{n:'水餃',e:'🥟',s:'freezer',d:180},
    {n:'蝦子',e:'🦐',s:'freezer',d:90},{n:'冰淇淋',e:'🍨',s:'freezer',d:180},
  ];
  const $ = id => document.getElementById(id);
  let items = [], view = 'all', statusFilter = null, editingId = null, photoData = '';

  // ---------- 日期工具 ----------
  const pad = n => String(n).padStart(2,'0');
  const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const addDays = n => { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+n); return fmt(d); };
  const daysLeft = str => {
    const [y,m,d] = str.split('-').map(Number);
    const t = new Date(); t.setHours(0,0,0,0);
    return Math.round((new Date(y,m-1,d) - t) / 86400000);
  };
  const statusOf = n => n < 0 ? 'expired' : n <= 2 ? 'urgent' : n <= 7 ? 'soon' : 'fresh';
  const label = n => n < 0 ? `已過期 ${-n} 天` : n === 0 ? '今天到期' : `剩 ${n} 天`;

  // ---------- 儲存 ----------
  function sample(){
    return [
      {n:'牛奶',e:'🥛',s:'fridge',d:1,q:1,note:'已開封'},
      {n:'雞蛋',e:'🥚',s:'fridge',d:12,q:10},
      {n:'高麗菜',e:'🥬',s:'fridge',d:5,q:1},
      {n:'優格',e:'🍦',s:'fridge',d:-2,q:2},
      {n:'雞胸肉',e:'🍗',s:'freezer',d:45,q:3},
      {n:'水餃',e:'🥟',s:'freezer',d:6,q:1,note:'一袋 30 顆'},
      {n:'冰淇淋',e:'🍨',s:'freezer',d:120,q:2},
    ].map((x,i)=>({id:Date.now()+i,name:x.n,emoji:x.e,photo:'',storage:x.s,expiry:addDays(x.d),qty:x.q,note:x.note||'',added:Date.now()+i}));
  }
  function load(){
    try{ const raw = localStorage.getItem(KEY); items = raw ? JSON.parse(raw) : sample(); }
    catch(e){ items = sample(); }
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(items)); }
    catch(e){ toast('儲存空間不足，請移除一些照片'); }
  }
  function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(()=>t.classList.remove('show'), 1800);
  }
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ---------- 畫面 ----------
  function render(){
    // 統計（依目前冷藏/冷凍分頁）
    const scope = items.filter(i => view==='all' || i.storage===view);
    const cnt = {expired:0,urgent:0,soon:0,fresh:0};
    scope.forEach(i => cnt[statusOf(daysLeft(i.expiry))]++);
    const defs = [['expired','已過期'],['urgent','0–2 天'],['soon','3–7 天'],['fresh','新鮮']];
    $('summary').innerHTML = defs.map(([k,t]) =>
      `<div class="sum s-${k} ${statusFilter===k?'active':''}" data-s="${k}"><b>${cnt[k]}</b><span>${t}</span></div>`).join('');

    // 篩選與排序
    const q = $('search').value.trim().toLowerCase();
    let list = scope.filter(i => (!q || i.name.toLowerCase().includes(q)) &&
      (!statusFilter || statusOf(daysLeft(i.expiry))===statusFilter));
    const sort = $('sort').value;
    list.sort((a,b) => sort==='name' ? a.name.localeCompare(b.name,'zh-Hant')
      : sort==='added' ? b.added-a.added : daysLeft(a.expiry)-daysLeft(b.expiry));

    $('grid').innerHTML = list.length ? list.map(i => {
      const n = daysLeft(i.expiry), st = statusOf(n);
      return `<article class="item ${st}" data-id="${i.id}">
        <span class="tag ${i.storage}">${i.storage==='fridge'?'🧊 冷藏':'❄️ 冷凍'}</span>
        <div class="ring">${i.photo?`<img src="${i.photo}" alt="${esc(i.name)}">`:esc(i.emoji||'🍽️')}</div>
        <div class="name">${esc(i.name)} ×${i.qty}</div>
        <div class="meta">到期：${i.expiry}</div>
        ${i.note?`<div class="meta">📝 ${esc(i.note)}</div>`:''}
        <span class="badge">${label(n)}</span>
        <div class="actions">
          <button data-act="use">用完了</button>
          <button data-act="edit">編輯</button>
          <button data-act="del">刪除</button>
        </div>
      </article>`;
    }).join('') : `<div class="empty">🫙 這裡還沒有食材<br>按「＋ 新增食材」開始記錄吧</div>`;
  }

  // ---------- 新增 / 編輯 ----------
  function setPreview(){
    const e = $('fEmoji').value.trim();
    $('preview').innerHTML = photoData ? `<img src="${photoData}" alt="">` : esc(e || '🍽️');
    $('clearPhoto').style.display = photoData ? '' : 'none';
  }
  function openForm(item){
    editingId = item ? item.id : null;
    $('dlgTitle').textContent = item ? '編輯食材' : '新增食材';
    $('fName').value = item ? item.name : '';
    $('fExpiry').value = item ? item.expiry : addDays(7);
    $('fQty').value = item ? item.qty : 1;
    $('fEmoji').value = item ? item.emoji : '';
    $('fNote').value = item ? item.note : '';
    $('fPhoto').value = '';
    photoData = item ? item.photo : '';
    document.querySelector(`input[name=storage][value=${item?item.storage:'fridge'}]`).checked = true;
    $('presets').style.display = item ? 'none' : '';
    setPreview();
    $('dlg').showModal();
  }
  $('presets').innerHTML = PRESETS.map((p,i)=>`<button type="button" data-i="${i}">${p.e} ${p.n}</button>`).join('');
  $('presets').addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    const p = PRESETS[b.dataset.i];
    $('fName').value = p.n; $('fEmoji').value = p.e; photoData = '';
    $('fExpiry').value = addDays(p.d);
    document.querySelector(`input[name=storage][value=${p.s}]`).checked = true;
    setPreview();
  });
  $('fEmoji').addEventListener('input', setPreview);
  // 照片縮圖後轉 base64，避免塞爆 localStorage
  $('fPhoto').addEventListener('change', e => {
    const f = e.target.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const S = 200, c = document.createElement('canvas');
        c.width = c.height = S;
        const m = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, S, S);
        photoData = c.toDataURL('image/jpeg', 0.7); setPreview();
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(f);
  });
  $('clearPhoto').onclick = () => { photoData = ''; $('fPhoto').value=''; setPreview(); };
  $('cancelBtn').onclick = () => $('dlg').close();
  $('form').addEventListener('submit', e => {
    e.preventDefault();
    const data = {
      name: $('fName').value.trim(), emoji: $('fEmoji').value.trim() || '🍽️', photo: photoData,
      storage: document.querySelector('input[name=storage]:checked').value,
      expiry: $('fExpiry').value, qty: Math.max(1, parseInt($('fQty').value)||1), note: $('fNote').value.trim()
    };
    if(!data.name || !data.expiry) return;
    if(editingId){ Object.assign(items.find(i=>i.id===editingId), data); toast('已更新'); }
    else { items.push({id:Date.now(), added:Date.now(), ...data}); toast('已新增 ' + data.name); }
    save(); render(); $('dlg').close();
  });

  // ---------- 事件 ----------
  $('addBtn').onclick = () => openForm();
  $('tabs').onclick = e => {
    const b = e.target.closest('.tab'); if(!b) return;
    view = b.dataset.v;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t===b));
    render();
  };
  $('summary').onclick = e => {
    const c = e.target.closest('.sum'); if(!c) return;
    statusFilter = statusFilter === c.dataset.s ? null : c.dataset.s; render();
  };
  $('search').oninput = render; $('sort').onchange = render;
  $('grid').onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    const id = +b.closest('.item').dataset.id, it = items.find(i=>i.id===id);
    if(b.dataset.act==='edit') openForm(it);
    else if(b.dataset.act==='use'){
      if(it.qty>1){ it.qty--; toast(`${it.name} 剩 ${it.qty}`); }
      else { items = items.filter(i=>i.id!==id); toast(`${it.name} 已用完`); }
      save(); render();
    } else if(b.dataset.act==='del'){
      if(confirm(`確定刪除「${it.name}」？`)){ items = items.filter(i=>i.id!==id); save(); render(); toast('已刪除'); }
    }
  };
  $('resetBtn').onclick = () => { if(confirm('會清除目前所有資料並還原範例，確定嗎？')){ items = sample(); save(); render(); } };

  load(); render();
})();
</script>
</body>
</html>
